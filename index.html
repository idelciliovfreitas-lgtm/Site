<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idelcilio Vieira - Imóveis</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f8fafc',
              100: '#f1f5f9',
              500: '#1e293b',
              600: '#0d1127', // Logo Navy
              700: '#020617',
            },
            gold: {
              50: '#fffdf5',
              100: '#fffbeb',
              400: '#facc15',
              500: '#d4af37', // Logo Gold
              600: '#b8962e',
              700: '#927424',
            },
            secondary: '#f8fafc',
            accent: '#fef3c7',
            verified: '#16a34a',
          }
        }
      }
    };

    // Inicialização instantânea do tema para evitar clarão de tela branca
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap');

    body {
      font-family: "Plus Jakarta Sans", "Inter", system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      /* Correção para textos pixelados em PC */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Melhoria na renderização de fontes em negrito */
    .font-black {
      letter-spacing: -0.02em;
      -webkit-font-smoothing: subpixel-antialiased;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      font-family: inherit;
    }

    .leaflet-vignette {
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.05);
    }
  </style>

  }
}
</script>
